spring.application.name=kokkens-madpakke-route-planner
# Hosting platforms (Railway etc.) assign the port via $PORT at runtime.
server.port=${PORT:8080}
server.address=0.0.0.0

# DB_PATH lets a deployment point this at a persistent volume (e.g. /data/madpakke.db)
# so the database survives redeploys instead of living inside the ephemeral container.
spring.datasource.url=jdbc:sqlite:${DB_PATH:data/madpakke.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Google Maps Geocoding API key. Leave empty to use the free OpenStreetMap/Nominatim
# fallback automatically. Can also be set via the GOOGLE_MAPS_API_KEY environment variable.
madpakke.google-maps-api-key=${GOOGLE_MAPS_API_KEY:}

# Default depot/business address used as the start/end point for every route.
# Can be changed later from the Indstillinger (Settings) tab in the app.
madpakke.default-depot-address=${MADPAKKE_DEPOT_ADDRESS:}

# Assumed average driving speed, used to estimate drive time between stops
# from straight-line distance (no live traffic/directions API is used).
madpakke.avg-speed-kmh=30

# On-site time per stop type, in minutes.
madpakke.onsite-minutes.gym=10
madpakke.onsite-minutes.private=3

spring.jackson.serialization.write-dates-as-timestamps=false

# Always revalidate the UI files with the browser instead of using a cached copy,
# so a redeployed update shows up on refresh instead of needing a hard-refresh.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
